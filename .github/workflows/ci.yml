name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes to the same PR should stop burning runner minutes;
  # pushes to development/main always run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python
        # Reads .python-version, so CI and local dev share one interpreter pin.
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: make lint-check
      - name: Ruff format check
        run: make format-check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Create stub path
        # typings/ is gitignored; basedpyright warns when stubPath is missing.
        run: mkdir -p typings
      - name: basedpyright
        run: make typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # No core/.env on the runner; tests run against dev settings like locally.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      # The suite runs against SQLite with no broker; Redis/Celery are not needed.
      - name: Run tests
        run: make test

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Bandit
        run: make security