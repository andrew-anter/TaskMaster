[project]
name = "todo-app"
version = "0.1.0"
description = "ToDo App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.1",
  "django-environ>=0.12.0",
  "django-htmx>=1.23.0",
  "django-stubs-ext>=5.2.0",
  "django-unfold>=0.59.0",
]
authors = [
{ name = "Andrew Anter", email = "andrew.anter@gmail.com" },
]

[tool.pyright]
include = ["."] 
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv", 
    "**/migrations/*.py", 
]
reportMissingTypeStubs = false 
# reportUnknownMemberType = "warning"
# reportUnknownVariableType = "warning"

pythonVersion = "3.13" # Should match your project's Python version

venvPath = "." # Directory where venv directory is located
venv = ".venv"     # Name of the venv directory


[dependency-groups]
dev = [
    "django-debug-toolbar>=5.2.0",
    "django-stubs>=5.2.0",
    "django-stubs-ext>=5.2.0",
]
