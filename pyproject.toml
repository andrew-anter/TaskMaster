[project]
name = "todo-app"
version = "0.1.0"
description = "ToDo App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.1",
  "django-environ>=0.12.0",
  "django-stubs-ext>=5.2.0",
]
authors = [
{ name = "Andrew Anter", email = "andrew.anter@gmail.com" },
]


# --- Tool Configurations ---
[tool.ruff]
target-version = "py13" 
line-length = 100        
# E/W: pycodestyle errors/warnings
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade (modernize Python syntax)
# N: pep8-naming
# B: flake8-bugbear (finds potential bugs)
# C4: flake8-comprehensions (helps write more idiomatic comprehensions)
# Q: flake8-quotes (enforces quote consistency)
select = ["E", "F", "W", "I", "UP", "N", "B", "C4", "Q"]
exclude = [".venv", ".git", "__pycache__", "migrations"] 

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- MyPy Configuration ---
[tool.mypy]
python_version = "3.13"  

plugins = ["mypy_django_plugin.main"]

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

pretty = true
show_error_codes = true
show_column_numbers = true
exclude = 'migrations/'


[tool.django-stubs]
django_settings_module = "core.settings"

[dependency-groups]
dev = [
    "django-debug-toolbar>=5.2.0",
    "django-stubs-ext>=5.2.0",
]
