[project]
name = "TaskMaster"
version = "0.0.1"
description = "A Django + HTMX task management application with labels, reminders, in-app notifications, and a REST API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"django[argon2]>=6.1.3",
	"django-allauth[socialaccount]>=65.9.0",
	"django-colorfield>=0.14.0",
	"django-cors-headers>=4.7.0",
	"django-environ>=0.14.0",
	"django-htmx>=1.23.0",
	"djangorestframework>=3.18.3",
	"gunicorn>=26.0.0",
	"whitenoise>=6.12.0",
	"celery[redis]>=5.6.3",
	"psycopg[binary]>=3.3.9",
]
authors = [{ name = "Andrew Anter", email = "andrew.anter@gmail.com" }]

[tool.basedpyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "**/migrations/*.py", "src", "tmp"]
typeCheckingMode = "standard"
stubPath = "./typings"
pythonVersion = "3.13"
pythonPlatform = "Linux"
reportMissingTypeStubs = false
reportAssignmentType = "error"

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Explicit rule set so lint behaviour does not drift with ruff releases.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django ships mutable class attributes in generated migrations; RUF012 is noise there.
"**/migrations/*.py" = ["RUF012"]


[dependency-groups]
dev = [
	"bandit>=1.8.0",
	"basedpyright>=1.30.0",
	"django-stubs>=6.1.2",
	"django-stubs-ext>=5.2.0",
	"django-types>=0.24.0",
	"playwright>=1.65.1",
	"pyopenssl>=26.4.0",
	"pytest>=9.2.0",
	"pytest-django>=4.14.0",
	"ruff>=0.15",
	"werkzeug>=3.1.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py", "*/tests/*.py", "*/tests.py"]
norecursedirs = [".git", ".venv", "tmp", "node_modules", "staticfiles", ".pytest_cache"]

[tool.bandit]
exclude_dirs = [
	".venv",
	".git",
	"staticfiles",
	"typings",
	"src",
	"node_modules",
	"tmp",
	"reports",
]
skips = ["B101"]
