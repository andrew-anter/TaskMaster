[project]
name = "todo-app"
version = "0.1.1"
description = "ToDo App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2.1",
  "django-environ>=0.12.0",
  "django-extensions>=4.1",
  "django-filter>=25.1",
  "django-htmx>=1.23.0",
  "django-unfold>=0.59.0",
  "djangorestframework>=3.16.0",
  "drf-spectacular>=0.28.0",
  "markdown>=3.8",
]
authors = [
{ name = "Andrew Anter", email = "andrew.anter@gmail.com" },
]

[tool.basedpyright]
include = ["."] 
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv", 
    "**/migrations/*.py", 
]
typeCheckingMode="standard"
stubPath=[
  './typings/'
]


[dependency-groups]
dev = [
    "django-stubs>=5.2.0",
    "django-stubs-ext>=5.2.0",
    "django-types>=0.21.0",
]
