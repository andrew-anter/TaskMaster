{% extends "base.html" %}
{% block title %}Change Password - TaskMaster{% endblock title %}

{% block content %}
<div class="flex flex-col w-full items-center justify-center py-8 md:py-12">
  <div class="card w-full md:w-[450px] max-w-md bg-base-100 shadow-xl p-6 md:p-8">
    <h2 class="text-2xl font-bold text-center mb-6 text-base-content">Change Password</h2>
    <p class="text-sm text-center text-neutral-focus">Your password is now changed.</p>
    <div class="text-center mt-4 text-sm">
      <a href="{% url 'login' %}" class="link link-hover text-primary font-medium">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock content %}
