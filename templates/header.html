{% load static %} 

<header class="navbar bg-base-100 shadow-sm px-4 md:px-10 py-2">
    {# Navbar Start - Logo and Brand Name #}
    <div class="navbar-start">
        <a href="{% block brand_link %}{% url 'task_list' %}{% endblock brand_link %}" class="flex items-center gap-3">
            <div class="size-6 text-primary"> {# DaisyUI 'primary' color for the logo from Bumblebee #}
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path></svg>
            </div>
            <button 
                hx-get="{% url 'task_list' %}" {# Assuming task_list_partial was a mistake and it should load the main task_list view/content #}
                hx-target="#main-content"
                  {# Optional: if you want the URL to update #}
                class="btn btn-ghost normal-case text-xl font-bold tracking-tight">
                {% block brand_name %}TaskMaster{% endblock brand_name %}
            </button>
        </a>
    </div>

    <div class="navbar-end">
        {% include "navigation-bar.html" %}
    </div>
</header>
