{% load color_utils %}
<div id="label-form-container"
     class="layout-content-container flex flex-col w-full py-5">
    <form method="post"
          hx-post="{{ request.path }}"
          hx-target="#main-content"
          class="contents">
        {% csrf_token %}
        {{ form.color }}
        <div class="flex flex-wrap justify-between items-center gap-3 p-4">
            <h1 class="text-3xl font-bold text-base-content">{{ page_title|default:"Label" }}</h1>
            <div class="flex items-center gap-2">
                <button type="button"
                        x-data
                        @click="$store.navHistory.back('{% url 'label_list' %}')"
                        class="btn btn-ghost rounded-full normal-case">Cancel</button>
                <button type="submit" class="btn btn-primary rounded-full normal-case">
                    <i class="nf nf-fa-check text-lg"></i>
                    {% if form.instance.pk %}Update{% else %}Create{% endif %} Label
                </button>
            </div>
        </div>
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-6">
                {% if form.non_field_errors %}
                    <div role="alert" class="alert alert-error text-sm">
                        <i class="nf nf-md-alpha_x_circle text-lg text-error"></i>
                        <div>
                            {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
                        </div>
                    </div>
                {% endif %}
                {% include "labels/partials/_label_form_fields.html" %}
            </div>
        </div>
    </form>
</div>

<div id="toast-container" hx-swap-oob="afterbegin">
    {% include "partials/_messages.html" %}
</div>
