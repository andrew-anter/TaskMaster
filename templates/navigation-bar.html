{% load static %}
<div class="flex items-center gap-1 lg:gap-2 ml-2 lg:ml-4">
    {% if request.user.is_authenticated %}
        <button class="btn btn-ghost btn-xs sm:btn-sm rounded-full normal-case"
                hx-get="{% url 'home' %}"
                hx-target="#main-content"
                hx-push-url="true">My Tasks</button>
        <button class="btn btn-ghost btn-xs sm:btn-sm rounded-full normal-case"
                hx-get="{% url 'all_tasks' %}"
                hx-target="#main-content"
                hx-push-url="true">All Tasks</button>
        <button class="btn btn-ghost btn-xs sm:btn-sm rounded-full normal-case"
                hx-get="{% url 'label_list' %}"
                hx-target="#main-content"
                hx-push-url="true">Labels</button>
        {# Add Task Button #}
        <button class="btn btn-primary btn-xs sm:btn-sm btn-circle"
                hx-get="{% url 'task_add' %}"
                hx-target="#main-content"
                hx-push-url="true"
                title="Add Task"
                aria-label="Add Task">
            <i class="nf nf-fa-plus text-sm sm:text-lg"></i>
        </button>
        <button class="btn btn-ghost btn-xs sm:btn-sm btn-circle hidden lg:inline-flex"
                title="Notifications"
                aria-label="Notifications">
            <i class="nf nf-cod-bell text-sm sm:text-lg"></i>
        </button>
        {# User Profile Dropdown #}
        {% block user_profile %}
            <div class="dropdown dropdown-end">
                <div tabindex="0"
                     role="button"
                     class="btn btn-ghost btn-xs sm:btn-sm btn-circle"
                     aria-label="Account menu">
                    <i class="nf nf-fa-user text-sm sm:text-lg"></i>
                </div>
                <ul tabindex="0"
                    class="menu menu-sm dropdown-content mt-3 z-[50] p-2 shadow bg-base-100 rounded-box w-52">
                    <li><a hx-post="{% url 'logout' %}"
   hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>Logout</a></li>
                </ul>
            </div>
        {% endblock user_profile %}
    {% else %}
        <a href="{% url 'login' %}"
           class="btn btn-ghost btn-xs sm:btn-sm rounded-full normal-case">Log in</a>
        <a href="{% url 'register' %}"
           class="btn btn-primary btn-xs sm:btn-sm rounded-full normal-case">Sign up</a>
    {% endif %}
</div>
