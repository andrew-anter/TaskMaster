{% if messages %}
    {% for message in messages %}
        <div x-data="{ show: true }"
             x-init="setTimeout(() => show = false, 5000)"
             x-show="show"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-300"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-x-8"
             class="alert shadow-md text-sm flex justify-between items-center gap-2 mb-2
             {% if message.tags == 'success' %}
                 alert-success
             {% elif message.tags == 'error' %}
                 alert-error
             {% elif message.tags == 'warning' %}
                 alert-warning
             {% else %}
                 alert-info
             {% endif %}">
            <div class="flex items-center gap-2">
                {% if message.tags == 'success' %}
                    <i class="nf nf-md-check_circle text-lg"></i>
                {% elif message.tags == 'error' %}
                    <i class="nf nf-md-alpha_x_circle text-lg"></i>
                {% elif message.tags == 'warning' %}
                    <i class="nf nf-md-alert text-lg"></i>
                {% else %}
                    <i class="nf nf-md-alert_circle text-lg"></i>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            <button @click="show = false" class="btn btn-ghost btn-xs btn-circle" title="Dismiss">
                <i class="nf nf-md-close text-lg"></i>
            </button>
        </div>
    {% endfor %}
{% endif %}
